---
version: '3'
services:
  freqtrade3:
      image: freqtradeorg/freqtrade:stable
      restart: unless-stopped
      container_name: SMACross
      dns:
        - 8.8.8.8
        - 1.1.1.1
      volumes:
        - "./user_data:/freqtrade/user_data"
      # ports:
      #   - "8080:8080"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/sma_cross.log
        --db-url sqlite:////freqtrade/user_data/sma_cross.sqlite
        --config /freqtrade/user_data/config.json
        --strategy SMACross
