  freqtrade2:
      image: freqtradeorg/freqtrade:stable
      restart: unless-stopped
      container_name: RSIBreak
      dns:
        - 8.8.8.8
        - 1.1.1.1
      volumes:
        - "./user_data:/freqtrade/user_data"
      ports:
        - "8080:8080"
      environment:
        - PYTHONPATH=/freqtrade
      command: >
        trade
        --logfile /freqtrade/user_data/logs/rsi_break.log
        --db-url sqlite:////freqtrade/user_data/rsi_break.sqlite
        --config /freqtrade/user_data/config_rsi_break.json
        --strategy RSIBreak
