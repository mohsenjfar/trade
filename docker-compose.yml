---
version: '3'
services:
  freqtrade:
      image: freqtradeorg/freqtrade:latest
      restart: unless-stopped
      container_name: FreqStrategy
      dns:
        - 8.8.8.8
        - 1.1.1.1
      volumes:
        - "./user_data:/freqtrade/user_data"
      ports:
        - "8080:8080"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/freq_strategy_dry.log
        --db-url sqlite:////freqtrade/user_data/freq_strategy_db_dry.sqlite
        --config /freqtrade/user_data/config.json
        --strategy FreqStrategy