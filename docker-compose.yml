---
version: '3'
services:
  cluster_strategy_V1_dry:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: cluster_strategy_V1_dry
    volumes:
      - "./user_data:/freqtrade/user_data"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/cluster_strategy_V1_dry.log
      --db-url sqlite:////freqtrade/user_data/cluster_strategy_V1_dry.sqlite
      --config /freqtrade/user_data/cluster_strategy_v1_config.json
      --strategy ClusterStrategyV1
  cluster_strategy_V2_dry:
