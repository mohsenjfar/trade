---
version: '3'
services:
  freqtrade:
      image: freqtradeorg/freqtrade:develop_freqai
      restart: unless-stopped
      container_name: Trader
      dns:
        - 8.8.8.8
        - 1.1.1.1
      volumes:
        - "./user_data:/freqtrade/user_data"
      ports:
        - "8080:8080"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/strategy.log
        --db-url sqlite:////freqtrade/user_data/db.sqlite
        --config /freqtrade/user_data/config.json
        --strategy Strategy
        --freqaimodel XGBoostClassifier
