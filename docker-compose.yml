---
version: '3'
services:
  atlas_engine:
      image: freqtradeorg/freqtrade:stable
      restart: unless-stopped
      container_name: AtlasEngine
      volumes:
        - "./user_data:/freqtrade/user_data"
      environment:
        - PYTHONPATH=/freqtrade
      ports:
        - "8080:8080"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/atlas_engine.log
        --db-url sqlite:////freqtrade/user_data/atlas_engine.sqlite
        --config /freqtrade/user_data/config.json
        --strategy AtlasEngine