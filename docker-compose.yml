---
version: '3'
services:
  ClusterStrategyV4:
      image: freqtradeorg/freqtrade:develop_freqai
      restart: unless-stopped
      container_name: ClusterStrategyV4
      volumes:
        - "./user_data:/freqtrade/user_data"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/ClusterStrategyV4.log
        --db-url sqlite:////freqtrade/user_data/tradesv3_ClusterStrategyV4.sqlite
        --config /freqtrade/user_data/cluster_strategy_v4_config.json
        --strategy ClusterStrategyV4