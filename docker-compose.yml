---
version: '3'
services:
  freqtrade:
      image: freqtradeorg/freqtrade:latest
      restart: unless-stopped
      container_name: RSICrossStrategy
      dns:
        - 8.8.8.8
        - 1.1.1.1
      ports:
        - "127.0.0.1:8080:8080"
      volumes:
        - "./user_data:/freqtrade/user_data"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/rsi_cross_strategy_dry.log
        --db-url sqlite:////freqtrade/user_data/rsi_cross_strategy_db_dry.sqlite
        --config /freqtrade/user_data/config.json
        --strategy RSICrossStrategy