---
version: '3'
services:
  QuickAdapterV35:
      image: freqtradeorg/freqtrade:develop_freqai
      restart: unless-stopped
      container_name: QuickAdapterV35
      volumes:
        - "./user_data:/freqtrade/user_data"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/QuickAdapterV35.log
        --db-url sqlite:////freqtrade/user_data/tradesv3_QuickAdapterV35.sqlite
        --config /freqtrade/user_data/config_xgboost.json
        --strategy QuickAdapterV35
        --freqaimodel XGBoostRegressorQuickAdapterV35
