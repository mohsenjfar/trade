---
version: '3'
services:
  freqtrade:
      image: freqtradeorg/freqtrade:develop_freqai
      restart: unless-stopped
      container_name: TradeStrategy
      ports:
        - "127.0.0.1:8080:8080"
      volumes:
        - "./user_data:/freqtrade/user_data"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/Terminal.log
        --db-url sqlite:////freqtrade/user_data/db.sqlite
        --config /freqtrade/user_data/config.json
        --strategy Strategy
        --freqaimodel XGBoostClassifier

  
