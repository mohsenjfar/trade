---
version: '3'
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: "no"
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/BreakStrategy_dry.log
      --db-url sqlite:////freqtrade/user_data/BreakStrategy_dry.sqlite
      --config /freqtrade/user_data/break_config.json
      --strategy BreakStrategy