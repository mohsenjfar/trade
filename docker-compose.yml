---
version: '3'
services:
  MainStrategy:
      image: freqtradeorg/freqtrade:develop_freqai
      restart: unless-stopped
      container_name: MainStrategy
      volumes:
        - "./user_data:/freqtrade/user_data"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/MainStrategy.log
        --db-url sqlite:////freqtrade/user_data/tradesv3_MainStrategy.sqlite
        --config /freqtrade/user_data/config.json
        --strategy MainStrategy
        --freqaimodel XGBoostClassifier
