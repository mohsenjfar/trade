---
version: '3.8'

services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-adaptive
    restart: unless-stopped
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"  # برای دسترسی به FreqUI
    environment:
      - TZ=Asia/Tehran  # یا منطقه زمانی خودت
    command: >
      trade
      --strategy AdaptiveEntropySimpleStrategy
      --config /freqtrade/user_data/config_test.json
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite

  # برای پلات (اختیاری)
  freqtrade-plot:
    image: freqtradeorg/freqtrade:develop_plot
    container_name: freqtrade-plot
    profiles:
      - plot
    volumes:
      - "./user_data:/freqtrade/user_data"
    command: list-strategies  # این فقط برای حفظ ساختار، موقع استفاده override می‌کنیم
  freqtrade_vps:
    image: freqtradeorg/freqtrade:develop_freqai
    container_name: freqtrade_atlas_vps
    restart: unless-stopped
    
    # =========== محدودیت منابع برای VPS 4GB ===========
    deploy:
      resources:
        limits:
          memory: 3.5G
          cpus: '3.5'
        reservations:
          memory: 2G
          cpus: '2.0'
    
    # =========== تنظیمات حافظه و پردازش ===========
    environment:
      - PYTHONPATH=/freqtrade
      - PYTHONUNBUFFERED=1
      
      # محدودیت تردهای OpenMP و MKL (حیاتی برای XGBoost)
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      
      # تنظیمات حافظه
      - FREQTRADE__LOGLEVEL=INFO
      - FREQTRADE__MAX_OPEN_TRADES=2
      - FREQTRADE__DRY_RUN_WALLET=1000
    
    # =========== حجم‌های داده (Data Volumes) ===========
    volumes:
      # دیتای اصلی و مدل‌ها (حیاتی برای پایداری)
      - ./user_data:/freqtrade/user_data:rw
      
      # کانفیگ فقط خواندنی
      - ./user_data/config.json:/freqtrade/config.json:ro
      - ./user_data/secrets.json:/freqtrade/secrets.json:ro
      
      # لاگ‌ها
      - ./user_data/logs:/freqtrade/user_data/logs:rw
      
      # دیتابیس
      - ./user_data/db:/freqtrade/user_data/db:rw
    
    # =========== پورت‌ها ===========
    ports:
      - "8080:8080"    # API Server
    
    # =========== فرمان اجرا ===========
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/db/trades_vps.sqlite
      --config /freqtrade/config.json
      --strategy AtlasEngineVPS
      --freqaimodel XGBVPS
    
    # =========== سلامت سنجی ===========
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # =========== شبکه ===========
    networks:
      - freqtrade_net
    
    # =========== لاگینگ ===========
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

# =========== شبکه ===========
networks:
  freqtrade_net:
    driver: bridge