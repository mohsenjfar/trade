---
version: '3'
services:
  atlas_engine:
      image: freqtradeorg/freqtrade:stable
      restart: unless-stopped
      container_name: AtlasEngine
      dns:
        - 8.8.8.8
        - 1.1.1.1
      volumes:
        - "./user_data:/freqtrade/user_data"
      # ports:
      #   - "8080:8080"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/atlas_engine.log
        --db-url sqlite:////freqtrade/user_data/atlas_engine.sqlite
        --config /freqtrade/user_data/atlas_engine.json
        --strategy AtlasEngine
  rsi_cycle_engine:
      image: freqtradeorg/freqtrade:stable
      restart: unless-stopped
      container_name: RSICycleEngine
      dns:
        - 8.8.8.8
        - 1.1.1.1
      volumes:
        - "./user_data:/freqtrade/user_data"
      ports:
        - "8080:8080"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/rsi_cycle_engine.log
        --db-url sqlite:////freqtrade/user_data/rsi_cycle_engine.sqlite
        --config /freqtrade/user_data/rsi_cycle_engine.json
        --strategy RSICycleEngine

