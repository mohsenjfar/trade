---
version: '3'
services:
  freqtrade:
      image: freqtrade-tensorflow
      restart: unless-stopped
      container_name: LSTMPredictorStrategy
      # ports:
      #   - "127.0.0.1:8080:8080"
      volumes:
        - "./user_data:/freqtrade/user_data"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/lstm_predictor_strategy.log
        --db-url sqlite:////freqtrade/user_data/lstm_predictor_strategy_db.sqlite
        --config /freqtrade/user_data/config.json
        --strategy LSTMPredictorStrategy