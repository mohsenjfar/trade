---
version: '3'
services:
  freqtrade:
      image: freqstat:latest
      restart: unless-stopped
      container_name: EMACrossStrategy
      dns:
        - 8.8.8.8
        - 1.1.1.1
      volumes:
        - "./user_data:/freqtrade/user_data"
      ports:
        - "8080:8080"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/ema_cross_strategy_dry.log
        --db-url sqlite:////freqtrade/user_data/ema_cross_strategy_dry.sqlite
        --config /freqtrade/user_data/ema_cross_strategy_dry.json
        --strategy EMACrossStrategy