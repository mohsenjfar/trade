---
version: '3'
services:
  long:
      image: freqtradeorg/freqtrade:develop_freqai
      restart: unless-stopped
      container_name: Long
      ports:
        - "127.0.0.1:8080:8080"
      volumes:
        - "./user_data:/freqtrade/user_data"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/long.log
        --db-url sqlite:////freqtrade/user_data/long_db.sqlite
        --config /freqtrade/user_data/long_config.json
        --strategy Long
  short:
      image: freqtradeorg/freqtrade:develop_freqai
      restart: unless-stopped
      container_name: Short
      ports:
        - "127.0.0.1:8081:8080"
      volumes:
        - "./user_data:/freqtrade/user_data"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/short.log
        --db-url sqlite:////freqtrade/user_data/short_db.sqlite
        --config /freqtrade/user_data/short_config.json
        --strategy Short

  
