---
version: '3'
services:
  freqtrade:
      image: freqstat:latest
      restart: unless-stopped
      container_name: RSIOverCross
      dns:
        - 8.8.8.8
        - 1.1.1.1
      volumes:
        - "./user_data:/freqtrade/user_data"
      ports:
        - "8080:8080"
      command: >
        trade
        --logfile /freqtrade/user_data/logs/rsi_over_cross_dry.log
        --db-url sqlite:////freqtrade/user_data/rsi_over_cross_dry.sqlite
        --config /freqtrade/user_data/rsi_over_cross.json
        --strategy RSIOverCross